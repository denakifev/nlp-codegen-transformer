[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-codegen"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5,<3",
  "numpy>=1.26,<3",
  "tokenizers>=0.21,<0.23",
  "datasets>=3,<5",
  "omegaconf>=2.3,<3",
  "comet-ml>=3.49,<4",
  "python-dotenv>=1,<2",
]

[project.scripts]
nlp-prepare = "nlp_codegen.prepare:main"
nlp-train = "nlp_codegen.trainer:main"
nlp-predict = "nlp_codegen.inference:main"
nlp-pipeline = "nlp_codegen.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
